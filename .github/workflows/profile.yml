name: Update profile cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile.yml"
      - ".github/scripts/**"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Generate activity graph
        continue-on-error: true
        run: python3 .github/scripts/activity_graph.py
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&custom_title=PLAYER%20STATS&show_icons=true&bg_color=0A0618&title_color=FDA136&text_color=EDEDF3&icon_color=E4402A&ring_color=C22B8E&hide_border=true&border_radius=0
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&custom_title=WEAPONS%20OF%20CHOICE&layout=compact&langs_count=8&bg_color=0A0618&title_color=FDA136&text_color=EDEDF3&hide_border=true&border_radius=0
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          if git diff --cached --quiet; then
            echo "No card changes to commit."
            exit 0
          fi
          git commit -m "chore: update profile cards"
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "Cards pushed."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed; retrying in 5s..."
            sleep 5
          done
          echo "::error::Could not push cards. Check Settings > Actions > General > Workflow permissions (Read and write)."
          exit 1

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.gif?color_snake=#FDA136&color_dots=#2A2152,#5A1F4A,#C22B8E,#E4402A,#FDA136&color_background=#161032
            dist/snake.svg?color_snake=#FDA136&color_dots=#2A2152,#5A1F4A,#C22B8E,#E4402A,#FDA136

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
