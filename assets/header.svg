<h2 align="center">▓▒░ CURRENT QUEST ░▒▓</h2>

<div align="center">
  <a href="https://github.com/Moamen-R/OctoFin"><img src="./assets/octofin.svg" width="100%" alt="OctoFin: AI multi-agent enterprise accountant"/></a>
</div>

> **OctoFin** is a multi-agent financial workflow system that automates corporate bookkeeping with 100% mathematical accuracy. It combines Vision AI for document comprehension with a deterministic Python engine for calculations. The system extracts data from unstructured invoices and receipts, reconciles bank and digital wallet transactions, maps entries to the Chart of Accounts, and posts validated double-entry journals directly into ERP systems. Confidence-based routing and human-in-the-loop approval guardrails catch anomalies and keep full financial control.

<div align="center">
  <img src="./assets/pipeline.svg" width="100%" alt="OctoFin pipeline animation"/>
</div>

<div align="center">

| Module | What it does |
|:--|:--|
| 👁️ **Vision AI Extraction** | Reads unstructured invoices and receipts |
| 🧮 **Deterministic Python Engine** | Runs every calculation for 100% mathematical accuracy |
| 🔁 **Reconciliation Agent** | Matches bank and digital wallet transactions |
| 📒 **CoA Mapping + ERP Posting** | Posts validated double-entry journals into the ERP |
| 🚦 **Confidence Routing** | Sends anomalies to human-in-the-loop approval |
| 📈 **Real-Time Insights** | Live visibility into the company's financials |

