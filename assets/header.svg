<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="sun" x1="0" y1="66" x2="0" y2="234" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDA136"/>
      <stop offset="0.55" stop-color="#E4402A"/>
      <stop offset="1" stop-color="#C22B8E"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#C22B8E" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C22B8E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" fill-opacity="0.35"/>
    </pattern>
    <clipPath id="floor">
      <rect x="0" y="234" width="1200" height="66"/>
    </clipPath>
  </defs>
  <style>
    .tw{animation:tw 2.4s steps(2) infinite}
    @keyframes tw{0%,100%{opacity:1}50%{opacity:.15}}
    .sun{animation:float 4s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .glow{transform-box:fill-box;transform-origin:center;animation:pulse 4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
    .h{animation:run 3s linear infinite}
    @keyframes run{from{transform:translateY(0)}to{transform:translateY(66px)}}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .gl{animation:glitch 6s steps(1) infinite}
    @keyframes glitch{0%,92%,100%{transform:translate(0,0)}93%{transform:translate(-4px,0)}95%{transform:translate(4px,0)}97%{transform:translate(-2px,0)}}
  </style>

  <rect width="1200" height="300" fill="#0A0618"/>

  <g fill="#EDEDF3">
    <rect class="tw" x="80" y="30" width="4" height="4"/>
    <rect class="tw" x="160" y="60" width="4" height="4" style="animation-delay:-.6s"/>
    <rect class="tw" x="250" y="24" width="4" height="4" style="animation-delay:-1.2s"/>
    <rect class="tw" x="340" y="48" width="4" height="4" style="animation-delay:-1.8s"/>
    <rect class="tw" x="430" y="20" width="4" height="4" style="animation-delay:-.3s"/>
    <rect class="tw" x="520" y="44" width="4" height="4" style="animation-delay:-.9s"/>
    <rect class="tw" x="700" y="28" width="4" height="4" style="animation-delay:-1.5s"/>
    <rect class="tw" x="760" y="80" width="4" height="4" style="animation-delay:-2.1s"/>
    <rect class="tw" x="1110" y="190" width="4" height="4" style="animation-delay:-.4s"/>
    <rect class="tw" x="660" y="170" width="4" height="4" style="animation-delay:-1.1s"/>
    <rect class="tw" x="20" y="130" width="4" height="4" style="animation-delay:-1.7s"/>
  </g>
  <g fill="#FDA136">
    <rect class="tw" x="610" y="64" width="6" height="6" style="animation-delay:-.8s"/>
    <rect class="tw" x="840" y="22" width="6" height="6" style="animation-delay:-1.4s"/>
    <rect class="tw" x="1080" y="44" width="6" height="6" style="animation-delay:-.2s"/>
    <rect class="tw" x="1160" y="110" width="6" height="6" style="animation-delay:-2s"/>
    <rect class="tw" x="790" y="200" width="6" height="6" style="animation-delay:-1s"/>
  </g>

  <circle class="glow" cx="960" cy="150" r="150" fill="url(#glow)"/>

  <g class="sun" fill="url(#sun)">
    <rect x="924" y="66" width="72" height="12"/>
    <rect x="912" y="78" width="96" height="12"/>
    <rect x="900" y="90" width="120" height="12"/>
    <rect x="888" y="102" width="144" height="12"/>
    <rect x="876" y="114" width="168" height="12"/>
    <rect x="876" y="126" width="168" height="12"/>
    <rect x="876" y="138" width="168" height="12"/>
    <rect x="876" y="150" width="168" height="12"/>
    <rect x="876" y="162" width="168" height="9"/>
    <rect x="876" y="174" width="168" height="8"/>
    <rect x="888" y="186" width="144" height="7"/>
    <rect x="900" y="198" width="120" height="6"/>
    <rect x="912" y="210" width="96" height="5"/>
    <rect x="924" y="222" width="72" height="4"/>
  </g>

  <rect x="0" y="234" width="1200" height="66" fill="#120A2A"/>
  <rect x="0" y="232" width="1200" height="3" fill="#FDA136"/>

  <g clip-path="url(#floor)" stroke="#C22B8E" stroke-opacity="0.6" stroke-width="2">
    <line x1="600" y1="234" x2="-600" y2="300"/>
    <line x1="600" y1="234" x2="-200" y2="300"/>
    <line x1="600" y1="234" x2="150" y2="300"/>
    <line x1="600" y1="234" x2="400" y2="300"/>
    <line x1="600" y1="234" x2="600" y2="300"/>
    <line x1="600" y1="234" x2="800" y2="300"/>
    <line x1="600" y1="234" x2="1050" y2="300"/>
    <line x1="600" y1="234" x2="1400" y2="300"/>
    <line x1="600" y1="234" x2="1800" y2="300"/>
  </g>
  <g clip-path="url(#floor)" fill="#C22B8E" fill-opacity="0.6">
    <rect class="h" x="0" y="234" width="1200" height="2"/>
    <rect class="h" x="0" y="234" width="1200" height="2" style="animation-delay:-1s"/>
    <rect class="h" x="0" y="234" width="1200" height="2" style="animation-delay:-2s"/>
  </g>

  <g font-family="'Courier New', Courier, monospace" font-weight="700">
    <text x="60" y="92" font-size="18" fill="#C22B8E" letter-spacing="2">PLAYER_01 // EGYPT</text>
    <g class="gl">
      <text x="65" y="170" font-size="64" fill="#E4402A">MO'MEN REFAEY</text>
      <text x="60" y="165" font-size="64" fill="#EDEDF3">MO'MEN REFAEY</text>
    </g>
    <text x="60" y="210" font-size="20" fill="#FDA136">&gt; FULL-STACK DEV | AI SYSTEMS BUILDER</text>
    <rect class="cur" x="512" y="194" width="12" height="20" fill="#FDA136"/>
  </g>

  <rect width="1200" height="300" fill="url(#scan)"/>
  <rect x="2" y="2" width="1196" height="296" fill="none" stroke="#221B45" stroke-width="4"/>
  <g fill="#FDA136">
    <rect x="0" y="0" width="12" height="12"/>
    <rect x="1188" y="0" width="12" height="12"/>
    <rect x="0" y="288" width="12" height="12"/>
    <rect x="1188" y="288" width="12" height="12"/>
  </g>
</svg>
