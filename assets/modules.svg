<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" shape-rendering="crispEdges">
  <defs>
    <style>
      .mono{font-family:'Courier New',Consolas,'DejaVu Sans Mono',monospace}
      .frame{animation:frame 6s steps(3) infinite}
      @keyframes frame{0%{fill:#C22B8E}33%{fill:#E4402A}66%{fill:#FDA136}100%{fill:#C22B8E}}
      .hl{opacity:0;animation:hl 6s linear infinite}
      @keyframes hl{0%,100%{opacity:0}2%,15%{opacity:1}17%{opacity:0}}
      .blink{animation:on 1s steps(1) infinite}
      @keyframes on{50%{opacity:0}}
      .look{animation:look 3s steps(1) infinite}
      @keyframes look{0%{transform:translateX(0)}33%{transform:translateX(-1px)}66%{transform:translateX(1px)}}
      .slideR{animation:slideR 1s steps(2) infinite alternate}
      @keyframes slideR{from{transform:translateX(0)}to{transform:translateX(4px)}}
      .slideL{animation:slideL 1s steps(2) infinite alternate}
      @keyframes slideL{from{transform:translateX(0)}to{transform:translateX(-4px)}}
      .write{animation:write 3s steps(1) infinite both}
      @keyframes write{0%{opacity:0}30%,100%{opacity:1}}
      .light{opacity:.25;animation:light 3s steps(1) infinite}
      @keyframes light{0%,33%{opacity:1}34%,100%{opacity:.25}}
      .bar{transform-box:fill-box;transform-origin:50% 100%;animation:bar 1.6s steps(4) infinite alternate}
      @keyframes bar{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
    </style>
    <pattern id="dash" x="40" y="62" width="12" height="4" patternUnits="userSpaceOnUse"><rect width="8" height="4" fill="#C22B8E"/></pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#FFFFFF" opacity=".035"/></pattern>
  </defs>

  <!-- panel + animated pixel frame -->
  <rect x="12" y="12" width="876" height="376" fill="#0A0618"/>
  <g class="frame" fill="#C22B8E">
    <rect x="16" y="8" width="868" height="4"/><rect x="16" y="388" width="868" height="4"/>
    <rect x="8" y="16" width="4" height="368"/><rect x="888" y="16" width="4" height="368"/>
    <rect x="12" y="12" width="4" height="4"/><rect x="884" y="12" width="4" height="4"/>
    <rect x="12" y="384" width="4" height="4"/><rect x="884" y="384" width="4" height="4"/>
  </g>

  <!-- title bar -->
  <text x="40" y="50" class="mono" font-size="18" font-weight="bold" fill="#FDA136" letter-spacing="2">OCTOFIN // MODULE LOADOUT</text>
  <rect class="blink" x="714" y="42" width="8" height="8" fill="#FDA136"/>
  <text x="860" y="50" class="mono" font-size="12" fill="#EDEDF3" text-anchor="end" letter-spacing="1">6/6 MODULES ONLINE</text>
  <rect x="40" y="62" width="820" height="4" fill="url(#dash)"/>

  <!-- card bases -->
  <g fill="#120C2A" stroke="#2A2152" stroke-width="2">
    <rect x="26" y="86" width="272" height="128"/><rect x="314" y="86" width="272" height="128"/><rect x="602" y="86" width="272" height="128"/>
    <rect x="26" y="228" width="272" height="128"/><rect x="314" y="228" width="272" height="128"/><rect x="602" y="228" width="272" height="128"/>
  </g>

  <!-- sequential highlight (pipeline order) -->
  <g fill="#FDA136" fill-opacity=".06" stroke="#FDA136" stroke-width="3">
    <rect class="hl" style="animation-delay:0s" x="26" y="86" width="272" height="128"/>
    <rect class="hl" style="animation-delay:1s" x="314" y="86" width="272" height="128"/>
    <rect class="hl" style="animation-delay:2s" x="602" y="86" width="272" height="128"/>
    <rect class="hl" style="animation-delay:3s" x="26" y="228" width="272" height="128"/>
    <rect class="hl" style="animation-delay:4s" x="314" y="228" width="272" height="128"/>
    <rect class="hl" style="animation-delay:5s" x="602" y="228" width="272" height="128"/>
  </g>

  <!-- slot numbers + LEDs -->
  <g class="mono" font-size="12" font-weight="bold" fill="#C22B8E" text-anchor="end">
    <text x="280" y="114">01</text><text x="568" y="114">02</text><text x="856" y="114">03</text>
    <text x="280" y="256">04</text><text x="568" y="256">05</text><text x="856" y="256">06</text>
  </g>
  <g fill="#FDA136">
    <rect class="blink" x="248" y="105" width="8" height="8"/>
    <rect class="blink" style="animation-delay:.2s" x="536" y="105" width="8" height="8"/>
    <rect class="blink" style="animation-delay:.4s" x="824" y="105" width="8" height="8"/>
    <rect class="blink" style="animation-delay:.6s" x="248" y="247" width="8" height="8"/>
    <rect class="blink" style="animation-delay:.8s" x="536" y="247" width="8" height="8"/>
    <rect class="blink" style="animation-delay:1s" x="824" y="247" width="8" height="8"/>
  </g>

  <!-- 01 Vision AI Extraction: eye -->
  <g transform="translate(44 106) scale(4)">
    <g fill="#FDA136"><rect x="2" y="0" width="4" height="1"/><rect x="1" y="1" width="1" height="1"/><rect x="6" y="1" width="1" height="1"/><rect x="0" y="2" width="1" height="2"/><rect x="7" y="2" width="1" height="2"/><rect x="1" y="4" width="1" height="1"/><rect x="6" y="4" width="1" height="1"/><rect x="2" y="5" width="4" height="1"/></g>
    <rect class="look" x="3" y="2" width="2" height="2" fill="#C22B8E"/>
  </g>

  <!-- 02 Deterministic Python Engine: calculator -->
  <g transform="translate(332 102)">
    <rect x="3" y="0" width="26" height="32" fill="#EDEDF3"/>
    <rect x="6" y="3" width="20" height="8" fill="#0A0618"/>
    <rect class="blink" x="18" y="5" width="6" height="4" fill="#FDA136"/>
    <g fill="#C22B8E"><rect x="6" y="14" width="5" height="5"/><rect x="14" y="14" width="5" height="5"/><rect x="21" y="14" width="5" height="5"/><rect x="6" y="22" width="5" height="5"/><rect x="14" y="22" width="5" height="5"/></g>
    <rect x="21" y="22" width="5" height="5" fill="#E4402A"/>
  </g>

  <!-- 03 Reconciliation Agent: two-way arrows -->
  <g transform="translate(620 102)">
    <g class="slideR" fill="#FDA136"><rect x="0" y="8" width="22" height="4"/><rect x="22" y="4" width="4" height="12"/><rect x="26" y="8" width="4" height="4"/></g>
    <g class="slideL" fill="#C22B8E"><rect x="10" y="20" width="22" height="4"/><rect x="6" y="16" width="4" height="12"/><rect x="2" y="20" width="4" height="4"/></g>
  </g>

  <!-- 04 CoA Mapping + ERP Posting: ledger -->
  <g transform="translate(44 244)">
    <rect x="2" y="0" width="26" height="32" fill="#FDA136"/>
    <rect x="2" y="0" width="5" height="32" fill="#E4402A"/>
    <rect class="write" x="11" y="7" width="13" height="3" fill="#0A0618"/>
    <rect class="write" style="animation-delay:.6s" x="11" y="14" width="13" height="3" fill="#0A0618"/>
    <rect class="write" style="animation-delay:1.2s" x="11" y="21" width="9" height="3" fill="#0A0618"/>
  </g>

  <!-- 05 Confidence Routing: traffic light -->
  <g transform="translate(332 244)">
    <rect x="8" y="0" width="16" height="32" fill="#2A2152"/>
    <rect class="light" x="12" y="3" width="8" height="8" fill="#E4402A"/>
    <rect class="light" style="animation-delay:1s" x="12" y="12" width="8" height="8" fill="#FDA136"/>
    <rect class="light" style="animation-delay:2s" x="12" y="21" width="8" height="8" fill="#EDEDF3"/>
  </g>

  <!-- 06 Real-Time Insights: growing bars -->
  <g transform="translate(620 244)">
    <rect x="0" y="30" width="32" height="2" fill="#EDEDF3"/>
    <rect class="bar" x="2" y="20" width="6" height="10" fill="#C22B8E"/>
    <rect class="bar" style="animation-delay:.2s" x="10" y="14" width="6" height="16" fill="#E4402A"/>
    <rect class="bar" style="animation-delay:.4s" x="18" y="8" width="6" height="22" fill="#FDA136"/>
    <rect class="bar" style="animation-delay:.6s" x="26" y="2" width="6" height="28" fill="#FDA136"/>
  </g>

  <!-- module names -->
  <g class="mono" font-size="13" font-weight="bold" fill="#FDA136">
    <text x="44" y="166">Vision AI Extraction</text>
    <text x="332" y="166">Deterministic Python Engine</text>
    <text x="620" y="166">Reconciliation Agent</text>
    <text x="44" y="308">CoA Mapping + ERP Posting</text>
    <text x="332" y="308">Confidence Routing</text>
    <text x="620" y="308">Real-Time Insights</text>
  </g>

  <!-- descriptions -->
  <g class="mono" font-size="11" fill="#C9C5DA">
    <text x="44" y="186">Reads unstructured invoices</text><text x="44" y="202">and receipts with Vision AI</text>
    <text x="332" y="186">Runs every calculation for</text><text x="332" y="202">100% mathematical accuracy</text>
    <text x="620" y="186">Matches bank and digital</text><text x="620" y="202">wallet transactions</text>
    <text x="44" y="328">Posts validated double-entry</text><text x="44" y="344">journals into the ERP</text>
    <text x="332" y="328">Sends anomalies to human-</text><text x="332" y="344">in-the-loop approval</text>
    <text x="620" y="328">Live visibility into the</text><text x="620" y="344">company's financials</text>
  </g>

  <text x="450" y="377" class="mono" font-size="11" fill="#8A84A8" text-anchor="middle" letter-spacing="1">▶ PIPELINE 01 → 06  ·  HUMAN-IN-THE-LOOP GUARDRAILS ACTIVE</text>

  <rect x="12" y="12" width="876" height="376" fill="url(#scanlines)"/>
</svg>
